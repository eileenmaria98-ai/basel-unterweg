name: Basel Unterwegs aktualisieren

on:
  schedule:
    - cron: "20 6 * * *"   # jeden Morgen, 06:20 UTC (07:20 Winterzeit, 08:20 Sommerzeit)
  workflow_dispatch:        # Knopf "Run workflow" zum manuellen Starten
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten des Kantons holen
        run: |
          mkdir -p _site
          python3 -u scripts/basel_karte.py _site
      - name: Seite zusammenstellen
        run: cp index.html zusatz.json manifest.webmanifest icon.svg icon-180.png icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
